# 修复：已删除废弃的 version 字段

services:
  mysql:
    image: mysql:8.0
    container_name: derma-mysql
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: derma_ai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend-ai/sql/init.sql:/docker-entrypoint-initdb.d/01-init-ai.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: derma-qdrant
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    container_name: derma-redis
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  fastapi:
    build:
      context: ../backend-ai
      dockerfile: Dockerfile
    container_name: derma-fastapi
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "8000:8000"
    env_file:
      - ../backend-ai/.env
    environment:
      - DOCKER_ENV=true
      - DATABASE_URL=mysql+aiomysql://root:root@mysql:3306/derma_ai
      - HF_ENDPOINT=https://huggingface.co
      - LOG_LEVEL=INFO
      - ENABLE_KB_RAG=true
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - X_INTERNAL_SECRET=derma_internal_secret
      - EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
      # INTEGRATION_* 全程从 env_file (.env) 读取，不从主机 shell 环境覆盖
      - OMP_NUM_THREADS=2
      - TORCH_NUM_THREADS=2
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ../backend-ai/static:/app/static
      - ../backend-ai/uploads:/app/uploads

volumes:
  mysql_data:
  qdrant_data:
  redis_data: